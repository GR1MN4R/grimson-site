
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>GRIMSON | Administration</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #101113;
      color: #e8e8e8;
      font-family: Arial, sans-serif;
      padding: 40px 20px;
    }
    main { max-width: 1100px; margin: auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      border-bottom: 1px solid #383a3d;
      padding-bottom: 22px;
      margin-bottom: 30px;
    }
    h1 { margin: 0; letter-spacing: 3px; }
    h2 { margin-top: 0; }
    p { color: #aaa; line-height: 1.6; }
    button {
      background: #b92929;
      border: 0;
      padding: 12px 20px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
    }
    button:hover { background: #d13636; }
    button:disabled { opacity: .5; cursor: wait; }
    .box {
      padding: 26px;
      background: #1b1d20;
      border: 1px solid #383a3d;
      border-radius: 8px;
    }
    #panel, #logout { display: none; }
    #entries { display: grid; gap: 14px; }
    .entry {
      padding: 20px;
      background: #151719;
      border: 1px solid #383a3d;
      border-radius: 6px;
    }
    .entry strong { color: #fff; }
    .entry p { margin: 7px 0; overflow-wrap: anywhere; }
    .status {
      display: inline-block;
      padding: 5px 10px;
      background: #383a3d;
      border-radius: 4px;
      font-size: 12px;
    }
    #message { margin-top: 20px; }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>GRIMSON</h1>
        <p>PRIVATE ADMINISTRATION</p>
      </div>
      <button id="logout">LOG OUT</button>
    </header>

    <section id="login" class="box">
      <h2>Administrator login</h2>
      <p>Authorized personnel only.</p>
      <button id="loginButton">ADMIN LOGIN</button>
    </section>

    <section id="panel">
      <div class="box">
        <h2>PREMIUM submissions</h2>
        <p id="account"></p>
        <button id="reloadButton">REFRESH SUBMISSIONS</button>
        <p id="loadStatus" role="status"></p>
        <div id="entries"></div>
      </div>
    </section>

    <p id="message" role="status"></p>
  </main>

  <script src="https://unpkg.com/netlify-identity-widget@1.9.2/build/netlify-identity-widget.js"></script>
  <script>
    const login = document.getElementById("login");
    const panel = document.getElementById("panel");
    const logout = document.getElementById("logout");
    const account = document.getElementById("account");
    const message = document.getElementById("message");
    const entries = document.getElementById("entries");
    const loadStatus = document.getElementById("loadStatus");
    const reloadButton = document.getElementById("reloadButton");

    function isAdmin(user) {
      return user?.email?.toLowerCase() === "admin@grimson.no" &&
        Array.isArray(user?.app_metadata?.roles) &&
        user.app_metadata.roles.includes("admin");
    }

    async function loadEntries() {
      const user = netlifyIdentity.currentUser();

      if (!isAdmin(user)) return;

      entries.replaceChildren();
      loadStatus.textContent = "Loading submissions...";
      reloadButton.disabled = true;

      try {
        const token = await user.jwt();

        const response = await fetch(
          "/.netlify/functions/christmas-admin-list",
          {
            headers: {
              "Authorization": "Bearer " + token
            },
            cache: "no-store"
          }
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Request failed.");
        }

        if (!isAdmin(netlifyIdentity.currentUser())) return;

        const submissions = data.entries || [];

        loadStatus.textContent =
          submissions.length + " submission(s) found.";

        for (const item of submissions) {
          const card = document.createElement("article");
          card.className = "entry";

          const title = document.createElement("h3");
          title.textContent = item.full_name || "Unnamed";

          const email = document.createElement("p");
          email.textContent = "Email: " + (item.email || "");

          const display = document.createElement("p");
          display.textContent =
            "Display name: " + (item.display_name || "Not provided");

          const verified = document.createElement("p");
          verified.textContent =
            "Email verified: " +
            (item.email_verified_at ? "Yes" : "No");

          const filename = document.createElement("p");
          filename.textContent =
            "Photo: " + (item.photo_original_filename || "");

          const date = document.createElement("p");
          date.textContent =
            "Submitted: " +
            (item.created_at
              ? new Date(item.created_at).toLocaleString()
              : "Unknown");

          const status = document.createElement("span");
          status.className = "status";
          status.textContent =
            item.moderation_status || "Unknown status";

          card.append(
            title, email, display, verified, filename, date, status
          );

          const photoButton = document.createElement("button");
          photoButton.type = "button";
          photoButton.textContent = "VIEW PHOTO";

          photoButton.onclick = async () => {
            photoButton.disabled = true;
            photoButton.textContent = "LOADING...";

            try {
              const currentUser = netlifyIdentity.currentUser();

              if (!isAdmin(currentUser)) {
                throw new Error("Administrator login required.");
              }

              const photoToken = await currentUser.jwt();

              const photoResponse = await fetch(
                "/.netlify/functions/christmas-admin-photo?id=" +
                  encodeURIComponent(item.id),
                {
                  headers: {
                    Authorization: "Bearer " + photoToken
                  },
                  cache: "no-store"
                }
              );

              if (!photoResponse.ok) {
                throw new Error(
                  "Photo request failed: HTTP " + photoResponse.status
                );
              }

              const photoBlob = await photoResponse.blob();
              const photoUrl = URL.createObjectURL(photoBlob);

              const photoWindow = window.open("", "_blank");

              if (!photoWindow) {
                URL.revokeObjectURL(photoUrl);
                throw new Error("Browser blocked the photo window.");
              }

              const image = photoWindow.document.createElement("img");
              image.src = photoUrl;
              image.style.maxWidth = "100%";
              image.style.height = "auto";

              photoWindow.document.body.append(image);

              photoWindow.addEventListener(
                "pagehide",
                () => URL.revokeObjectURL(photoUrl),
                { once: true }
              );
            } catch (error) {
              alert(error.message);
            } finally {
              photoButton.disabled = false;
              photoButton.textContent = "VIEW PHOTO";
            }
          };

          card.append(photoButton);

          entries.append(card);
        }
      } catch (error) {
        loadStatus.textContent = error.message;
      } finally {
        reloadButton.disabled = false;
      }
    }

    function refresh(user) {
      const authorized = isAdmin(user);

      login.style.display = authorized ? "none" : "block";
      panel.style.display = authorized ? "block" : "none";
      logout.style.display = user ? "inline-block" : "none";

      account.textContent = authorized ? user.email : "";
      entries.replaceChildren();

      message.textContent = !user
        ? "Please sign in."
        : authorized
          ? "Administrator authenticated."
          : "This account does not have administrator access.";

      if (authorized) loadEntries();
    }

    if (typeof netlifyIdentity === "undefined") {
      message.textContent = "Identity service could not be loaded.";
    } else {
      netlifyIdentity.on("init", refresh);
      netlifyIdentity.on("login", user => {
        refresh(user);
        netlifyIdentity.close();
      });
      netlifyIdentity.on("logout", () => refresh(null));

      document.getElementById("loginButton").onclick =
        () => netlifyIdentity.open("login");

      logout.onclick = () => netlifyIdentity.logout();
      reloadButton.onclick = loadEntries;

      netlifyIdentity.init();
    }
  </script>
</body>
</html>

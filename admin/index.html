<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>GRIMSON | Administration</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #101113; color: #e8e8e8; font-family: Arial, sans-serif; padding: 40px 20px; }
    main { max-width: 1100px; margin: auto; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 20px; border-bottom: 1px solid #383a3d; padding-bottom: 22px; margin-bottom: 30px; }
    h1 { margin: 0; letter-spacing: 3px; }
    h2 { margin-top: 0; }
    p { color: #aaa; line-height: 1.6; }
    button { background: #b92929; border: 0; padding: 12px 20px; color: white; font-weight: bold; cursor: pointer; border-radius: 4px; }
    button:hover { background: #d13636; }
    button:disabled { opacity: .5; cursor: wait; }
    .box { padding: 26px; background: #1b1d20; border: 1px solid #383a3d; border-radius: 8px; }
    #panel, #logout { display: none; }
    #entries { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 14px; }
    .entry { min-width: 0; padding: 20px; background: #151719; border: 1px solid #383a3d; border-radius: 6px; }
    .entry strong { color: #fff; }
    .entry p { margin: 7px 0; overflow-wrap: anywhere; }
    .status { display: inline-block; padding: 5px 10px; background: #383a3d; border-radius: 4px; font-size: 12px; }
    .preview { display: flex; width: 100%; aspect-ratio: 4 / 3; padding: 0; margin: 0 0 15px; background: #0c0d0f; border: 1px solid #383a3d; border-radius: 5px; align-items: center; justify-content: center; overflow: hidden; color: #aaa; font-weight: normal; }
    .preview:disabled { cursor: default; opacity: 1; }
    .preview img { width: 100%; height: 100%; object-fit: contain; }
    .preview:not(:disabled):hover { border-color: #b92929; background: #0c0d0f; }
    #message { margin-top: 20px; }
    .actions { display:flex; flex-wrap:wrap; gap:7px; margin-top:14px; }
    .actions button { padding:9px 12px; font-size:12px; }
    .actions .reject { background:#775d2d; }
    .actions .ban { background:#821f1f; }
    .actions .undo { background:#45494d; }
    .moderationNote { color:#bbb; font-size:12px; margin-top:9px; }

    .adminTabs { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:18px; }
    .adminTabs button[aria-pressed="false"] { background:#45494d; }
    #coreSection { display:none; }
    .coreTableWrap { overflow-x:auto; }
    .coreTable { width:100%; border-collapse:collapse; font-size:14px; }
    .coreTable th, .coreTable td { padding:11px 9px; text-align:left; border-bottom:1px solid #383a3d; overflow-wrap:anywhere; }
    .coreTable th { color:#fff; }
    #photoDialog { max-width: min(95vw, 1200px); max-height: 95vh; padding: 12px; background: #151719; color: #eee; border: 1px solid #555; border-radius: 8px; }
    #photoDialog::backdrop { background: rgba(0,0,0,.9); }
    #photoDialog img { display: block; max-width: 90vw; max-height: 80vh; width: auto; height: auto; object-fit: contain; }
    .dialogBar { display: flex; justify-content: space-between; align-items: center; gap: 15px; margin-bottom: 10px; }
    #photoCaption { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <header>
      <div><h1>GRIMSON</h1><p>PRIVATE ADMINISTRATION</p></div>
      <button id="logout" type="button">LOG OUT</button>
    </header>
    <section id="login" class="box">
      <h2>Administrator login</h2><p>Authorized personnel only.</p>
      <button id="loginButton" type="button">ADMIN LOGIN</button>
    </section>
    <section id="panel">
      <nav class="adminTabs" aria-label="Competition administration">
        <button id="premiumTab" type="button" aria-pressed="true">PREMIUM SUBMISSIONS</button>
        <button id="coreTab" type="button" aria-pressed="false">3× CORE — PARTICIPANTS</button>
      </nav>
      <div id="premiumSection" class="box">
        <h2>PREMIUM submissions</h2>
        <p id="account"></p>
        <button id="reloadButton" type="button">REFRESH SUBMISSIONS</button>
        <p id="loadStatus" role="status"></p>
        <div id="entries"></div>
      </div>
      <div id="coreSection" class="box">
        <h2>3× CORE participants</h2>
        <p>Names, email addresses and verification status. Read-only.</p>
        <button id="coreReloadButton" type="button">REFRESH PARTICIPANTS</button>
        <p id="coreStatus" role="status"></p>
        <div class="coreTableWrap">
          <table class="coreTable">
            <thead><tr><th>Name</th><th>Email</th><th>Verified</th><th>Registered</th></tr></thead>
            <tbody id="coreRows"></tbody>
          </table>
        </div>
      </div>
    </section>
    <p id="message" role="status"></p>
  </main>
  <dialog id="photoDialog" aria-label="Enlarged submission photo">
    <div class="dialogBar">
      <span id="photoCaption"></span>
      <button id="closePhoto" type="button">CLOSE</button>
    </div>
    <img id="largePhoto" alt="Enlarged contest submission">
  </dialog>
  <script src="https://unpkg.com/netlify-identity-widget@2.0.3/build/netlify-identity-widget.js"></script>
  <script>
    const login = document.getElementById("login");
    const panel = document.getElementById("panel");
    const logout = document.getElementById("logout");
    const account = document.getElementById("account");
    const message = document.getElementById("message");
    const entries = document.getElementById("entries");
    const loadStatus = document.getElementById("loadStatus");
    const reloadButton = document.getElementById("reloadButton");
    const photoDialog = document.getElementById("photoDialog");
    const largePhoto = document.getElementById("largePhoto");
    const photoCaption = document.getElementById("photoCaption");

    const premiumSection = document.getElementById("premiumSection");
    const coreSection = document.getElementById("coreSection");
    const premiumTab = document.getElementById("premiumTab");
    const coreTab = document.getElementById("coreTab");
    const coreRows = document.getElementById("coreRows");
    const coreStatus = document.getElementById("coreStatus");
    const coreReloadButton = document.getElementById("coreReloadButton");
    let coreController = null;
    let coreRun = 0;
    let activeTab = "premium";

    function clearCore() {
      coreRun++;
      if (coreController) coreController.abort();
      coreController = null;
      coreRows.replaceChildren();
      coreStatus.textContent = "";
      coreReloadButton.disabled = false;
    }

    function showTab(tab) {
      if (!isAdmin(netlifyIdentity.currentUser())) return;
      activeTab = tab;
      premiumSection.style.display = tab === "premium" ? "block" : "none";
      coreSection.style.display = tab === "core" ? "block" : "none";
      premiumTab.setAttribute("aria-pressed", String(tab === "premium"));
      coreTab.setAttribute("aria-pressed", String(tab === "core"));
      if (tab === "core") {
        clearSubmissions();
        loadCore();
      } else {
        clearCore();
        loadEntries();
      }
    }

    function appendCoreRow(item) {
      const tr = document.createElement("tr");
      const values = [
        item.full_name || "",
        item.email || "",
        item.email_verified_at ? "Yes" : "No",
        item.created_at ? new Date(item.created_at).toLocaleString() : "Unknown"
      ];
      for (const value of values) {
        const td = document.createElement("td");
        td.textContent = value;
        tr.append(td);
      }
      coreRows.append(tr);
    }

    async function loadCore() {
      const user = netlifyIdentity.currentUser();
      if (!isAdmin(user) || activeTab !== "core") return;
      clearCore();
      const run = coreRun;
      coreController = new AbortController();
      const signal = coreController.signal;
      coreReloadButton.disabled = true;
      coreStatus.textContent = "Loading CORE participants...";
      let count = 0;
      let verified = 0;
      try {
        const jwt = await user.jwt();
        let page = 0;
        while (true) {
          if (signal.aborted || run !== coreRun || !isAdmin(netlifyIdentity.currentUser())) return;
          const response = await fetch(
            "/.netlify/functions/christmas-admin-core-list?page=" + page,
            { headers: { Authorization: "Bearer " + jwt }, cache: "no-store", signal }
          );
          const data = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(data.error || "HTTP " + response.status);
          if (!Array.isArray(data.entries) || typeof data.hasMore !== "boolean") {
            throw new Error("Invalid CORE response.");
          }
          if (signal.aborted || run !== coreRun || !isAdmin(netlifyIdentity.currentUser())) return;
          for (const item of data.entries) {
            appendCoreRow(item);
            count++;
            if (item.email_verified_at) verified++;
          }
          coreStatus.textContent = count + " participant(s) loaded...";
          if (!data.hasMore) break;
          page++;
        }
        coreStatus.textContent = count + " participant(s) — " + verified + " verified, " + (count - verified) + " unverified.";
      } catch (error) {
        if (!signal.aborted && run === coreRun) {
          coreStatus.textContent = "Loading stopped: " + error.message + " (" + count + " loaded).";
        }
      } finally {
        if (run === coreRun) coreReloadButton.disabled = false;
      }
    }

    let generation = 0;
    let controller = null;
    let photoUrls = [];

    function isAdmin(user) {
      return user?.email?.toLowerCase() === "admin@grimson.no" &&
        Array.isArray(user?.app_metadata?.roles) &&
        user.app_metadata.roles.includes("admin");
    }

    function clearSubmissions() {
      generation++;
      if (controller) controller.abort();
      controller = null;
      if (photoDialog.open) photoDialog.close();
      largePhoto.removeAttribute("src");
      entries.replaceChildren();
      for (const url of photoUrls) URL.revokeObjectURL(url);
      photoUrls = [];
    }

    function addText(parent, label, value) {
      const p = document.createElement("p");
      p.textContent = label + value;
      parent.append(p);
    }

    function makeEntry(item) {
      const card = document.createElement("article");
      card.className = "entry";
      const preview = document.createElement("button");
      preview.type = "button";
      preview.className = "preview";
      preview.disabled = true;
      preview.textContent = "Loading photo...";
      preview.setAttribute("aria-label", "Preview photo for " + (item.full_name || "submission"));
      card.append(preview);

      const title = document.createElement("h3");
      title.textContent = item.full_name || "Unnamed";
      card.append(title);
      addText(card, "Email: ", item.email || "");
      addText(card, "Display name: ", item.display_name || "Not provided");
      addText(card, "Email verified: ", item.email_verified_at ? "Yes" : "No");
      addText(card, "Photo: ", item.photo_original_filename || "");
      addText(card, "Submitted: ", item.created_at ? new Date(item.created_at).toLocaleString() : "Unknown");
      const status = document.createElement("span");
      status.className = "status";
      status.textContent = item.moderation_status || "Unknown status";
      card.append(status);
      const actions = document.createElement("div");
      actions.className = "actions";
      for (const [action, label, css] of [["approve","APPROVE",""],["reject","REJECT","reject"],["ban","BAN","ban"],["undo","UNDO","undo"]]) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = css;
        button.textContent = label;
        button.disabled = !item.email_verified_at || (action === "approve" && item.moderation_status === "approved") || (action === "reject" && item.moderation_status === "rejected") || (action === "ban" && item.moderation_status === "banned");
        button.onclick = () => moderate(item, action, actions);
        actions.append(button);
      }
      card.append(actions);
      const note = document.createElement("p");
      note.className = "moderationNote";
      note.textContent = "Moderation decisions send an automatic email.";
      card.append(note);
      return { card, preview, item };
    }

    let moderationBusy = false;
    async function moderate(item, action, actions) {
      if (moderationBusy || !isAdmin(netlifyIdentity.currentUser())) return;
      let reason = "";
      if (action === "reject" || action === "ban") {
        const entered = window.prompt("Reason for " + action.toUpperCase() + " (required; will be included in the email):");
        if (entered === null) return;
        reason = entered.trim();
        if (!reason || reason.length > 1000) { alert("Enter a reason of 1–1000 characters."); return; }
      }
      const verb = { approve:"APPROVE", reject:"REJECT", ban:"BAN", undo:"UNDO" }[action];
      if (!window.confirm(verb + " submission for " + (item.full_name || item.email) + "?\nAn automatic email will be sent after saving the decision.")) return;
      moderationBusy = true;
      actions.querySelectorAll("button").forEach(b => b.disabled = true);
      loadStatus.textContent = "Saving moderation decision...";
      try {
        const jwt = await netlifyIdentity.currentUser().jwt();
        const response = await fetch("/.netlify/functions/christmas-admin-moderate", {
          method: "POST",
          headers: { "Authorization": "Bearer " + jwt, "Content-Type": "application/json" },
          cache: "no-store",
          body: JSON.stringify({ id: String(item.id), action, reason, requestId: crypto.randomUUID() })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || !data.success) throw new Error(data.error || "Moderation failed (HTTP " + response.status + ").");
        if (data.warning) alert(data.warning);
        else alert("Status: " + data.status + ". Notification: " + data.notification + ".");
        await loadEntries();
      } catch (error) {
        alert(error.message + "\nIf the request timed out, refresh the page to check the saved status before trying again.");
        await loadEntries();
      } finally { moderationBusy = false; }
    }

    async function loadPhoto(entry, jwt, signal, run) {
      const { preview, item } = entry;
      try {
        const response = await fetch(
          "/.netlify/functions/christmas-admin-photo?id=" + encodeURIComponent(String(item.id)),
          { headers: { Authorization: "Bearer " + jwt }, cache: "no-store", signal }
        );
        if (!response.ok) {
          const errorData = await response.json().catch(() => ({}));
          throw new Error(errorData.error || "HTTP " + response.status);
        }
        const blob = await response.blob();
        if (signal.aborted || run !== generation || !isAdmin(netlifyIdentity.currentUser())) return;
        if (!["image/jpeg", "image/png"].includes(blob.type)) throw new Error("Invalid image response.");
        const url = URL.createObjectURL(blob);
        photoUrls.push(url);
        const img = document.createElement("img");
        img.src = url;
        img.alt = "Submitted photograph";
        preview.replaceChildren(img);
        preview.disabled = false;
        preview.onclick = () => {
          if (!isAdmin(netlifyIdentity.currentUser())) return;
          largePhoto.src = url;
          photoCaption.textContent = (item.full_name || "Submission") + " — " + (item.photo_original_filename || "Photo");
          photoDialog.showModal();
        };
      } catch (error) {
        if (signal.aborted || run !== generation) return;
        preview.textContent = "Photo unavailable: " + error.message;
        preview.disabled = true;
      }
    }

    async function loadEntries() {
      const user = netlifyIdentity.currentUser();
      if (!isAdmin(user)) return;
      clearSubmissions();
      const run = generation;
      controller = new AbortController();
      const signal = controller.signal;
      loadStatus.textContent = "Loading submissions...";
      reloadButton.disabled = true;
      try {
        const jwt = await user.jwt();
        if (signal.aborted || run !== generation) return;
        const response = await fetch("/.netlify/functions/christmas-admin-list", {
          headers: { Authorization: "Bearer " + jwt },
          cache: "no-store", signal
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Request failed.");
        if (!Array.isArray(data.entries)) throw new Error("Invalid submissions response.");
        if (signal.aborted || run !== generation || !isAdmin(netlifyIdentity.currentUser())) return;
        const cards = data.entries.map(makeEntry);
        entries.replaceChildren(...cards.map(e => e.card));
        loadStatus.textContent = cards.length + " submission(s) found.";
        // Limit simultaneous private-photo requests to four.
        let next = 0;
        const workers = Array.from({ length: Math.min(4, cards.length) }, async () => {
          while (!signal.aborted && run === generation && next < cards.length) {
            const entry = cards[next++];
            await loadPhoto(entry, jwt, signal, run);
          }
        });
        await Promise.all(workers);
      } catch (error) {
        if (!signal.aborted && run === generation) loadStatus.textContent = error.message;
      } finally {
        if (run === generation) reloadButton.disabled = false;
      }
    }

    function refresh(user) {
      clearSubmissions();
      clearCore();
      activeTab = "premium";
      premiumSection.style.display = "block";
      coreSection.style.display = "none";
      premiumTab.setAttribute("aria-pressed", "true");
      coreTab.setAttribute("aria-pressed", "false");
      const authorized = isAdmin(user);
      login.style.display = authorized ? "none" : "block";
      panel.style.display = authorized ? "block" : "none";
      logout.style.display = user ? "inline-block" : "none";
      account.textContent = authorized ? user.email : "";
      loadStatus.textContent = "";
      message.textContent = !user ? "Please sign in." : authorized
        ? "Administrator authenticated." : "This account does not have administrator access.";
      if (authorized) loadEntries();
    }

    document.getElementById("closePhoto").onclick = () => photoDialog.close();
    photoDialog.addEventListener("close", () => largePhoto.removeAttribute("src"));

    if (typeof netlifyIdentity === "undefined") {
      message.textContent = "Identity service could not be loaded.";
    } else {
      netlifyIdentity.on("init", refresh);
      netlifyIdentity.on("login", user => { refresh(user); netlifyIdentity.close(); });
      netlifyIdentity.on("logout", () => refresh(null));
      document.getElementById("loginButton").onclick = () => netlifyIdentity.open("login");
      logout.onclick = () => netlifyIdentity.logout();
      reloadButton.onclick = loadEntries;
      premiumTab.onclick = () => showTab("premium");
      coreTab.onclick = () => showTab("core");
      coreReloadButton.onclick = loadCore;
      netlifyIdentity.init();
    }
  </script>
</body>
</html>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Product Selector — GRIMSON</title>
<meta name="description" content="Select GRIMSON MK-I CORE LINE or MK-I PREMIUM LINE.">

<style>
@font-face{
  font-family:"ElementalEnd";
  src:url("ElementalEnd.woff2") format("woff2");
  font-weight:normal;
  font-style:normal;
}

html, body{
  margin:0;
  min-height:100%;
}

body{
  font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  color:#e6edf3;
  background:#05070a;
  overflow-x:hidden;
  padding-bottom:70px;
}

.bgImage{
  position:fixed;
  inset:0;
  background:
    linear-gradient(rgba(0,0,0,.34), rgba(0,0,0,.52)),
    url("grimson-bg.jpg");
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  filter:brightness(.72) blur(3px);
  transform:scale(1.02);
  z-index:1;
}

.homeLogo{
  position:fixed;
  top:30px;
  left:30px;
  z-index:10;
}

.homeLogo img{
  height:38px;
  opacity:.88;
  transition:.25s ease;
  display:block;
}

.homeLogo img:hover{
  opacity:1;
  transform:scale(1.05);
}

.selectorShell{
  position:relative;
  z-index:2;
  min-height:calc(100vh - 70px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:70px 24px 40px;
  box-sizing:border-box;
}

.selectorModal{
  width:72vw;
  max-width:1180px;
  min-width:820px;
  background:rgba(8,12,17,.82);
  border:1px solid rgba(74,123,181,.28);
  border-radius:18px;
  padding:34px 36px 38px;
  box-sizing:border-box;
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  box-shadow:0 28px 80px rgba(0,0,0,.58);
  animation:modalIn .25s ease both;
}

@keyframes modalIn{
  from{
    opacity:0;
    transform:scale(.96) translateY(10px);
  }
  to{
    opacity:1;
    transform:scale(1) translateY(0);
  }
}

.selectorTitle{
  text-align:center;
  margin:0 0 30px;
}

.selectorTitle h1{
  font-family:"ElementalEnd", Arial, sans-serif;
  font-size:36px;
  line-height:1.1;
  letter-spacing:3px;
  margin:0 0 10px;
  color:#eaf4ff;
}

.selectorTitle p{
  margin:0;
  font-size:16px;
  color:#aebfd0;
  letter-spacing:.5px;
}

.selectorGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:28px;
}

.productVideoButton{
  position:relative;
  display:block;
  height:430px;
  border-radius:14px;
  overflow:hidden;
  text-decoration:none;
  color:#eaf4ff;
  background:rgba(255,255,255,.03);
  border:1px solid rgba(74,123,181,.24);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.04);
  cursor:pointer;
}

.productVideoButton video{
  width:100%;
  height:100%;
  object-fit:contain;
  background:#000;
  display:block;
  transform:scale(1);
  transition:transform .45s ease, filter .45s ease;
  filter:brightness(.82);
}

.productVideoButton::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(to top, rgba(0,0,0,.62), rgba(0,0,0,.12) 48%, rgba(0,0,0,.22)),
    radial-gradient(ellipse at center, rgba(80,140,200,.10), transparent 62%);
  z-index:1;
  transition:background .28s ease;
}

.productVideoButton::after{
  content:"EXpLORE";
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%, -44%);
  z-index:3;
  font-family:"ElementalEnd", Arial, sans-serif;
  font-size:28px;
  letter-spacing:3px;
  color:#ffffff;
  opacity:0;
  transition:opacity .25s ease, transform .25s ease;
  text-shadow:0 0 18px rgba(0,0,0,.65);
}

.productVideoButton:hover{
  border-color:#4a7bb5;
  box-shadow:
    0 0 18px rgba(74,123,181,.26),
    inset 0 0 0 1px rgba(255,255,255,.08);
}

.productVideoButton:hover video{
  transform:scale(1.045);
  filter:brightness(.62);
}

.productVideoButton:hover::before{
  background:
    linear-gradient(to top, rgba(0,0,0,.76), rgba(0,0,0,.42), rgba(0,0,0,.34)),
    radial-gradient(ellipse at center, rgba(80,140,200,.16), transparent 62%);
}

.productVideoButton:hover::after{
  opacity:1;
  transform:translate(-50%, -50%);
}

.lineLabel{
  position:absolute;
  left:0;
  right:0;
  bottom:26px;
  z-index:2;
  text-align:center;
  font-family:"ElementalEnd", Arial, sans-serif;
  font-size:24px;
  letter-spacing:2.4px;
  color:#eef7ff;
  text-shadow:0 3px 18px rgba(0,0,0,.75);
}

.lineSub{
  position:absolute;
  left:22px;
  top:20px;
  z-index:2;
  padding:7px 10px;
  border-radius:999px;
  font-size:11px;
  font-weight:700;
  letter-spacing:1.2px;
  color:#d7e8f8;
  background:rgba(8,12,17,.62);
  border:1px solid rgba(255,255,255,.12);
}

.closeLink{
  display:block;
  width:max-content;
  margin:28px auto 0;
  color:#aebfd0;
  text-decoration:none;
  font-size:13px;
  letter-spacing:.4px;
  transition:.2s ease;
}

.closeLink:hover{
  color:#ffffff;
}

.footer{
  position:fixed;
  left:0;
  bottom:0;
  width:100%;
  z-index:5;
  padding:10px 14px;
  box-sizing:border-box;
  font-size:12px;
  color:#b9c7d6;
  text-align:center;
  background:rgba(5,7,10,.78);
  border-top:1px solid rgba(255,255,255,.10);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
}

.footerRow{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:10px 18px;
  max-width:1400px;
  margin:0 auto;
}

.footer a{
  color:#b9c7d6;
  text-decoration:none;
  transition:.2s;
}

.footer a:hover{
  color:#ffffff;
}

.sep{
  opacity:.45;
}

@media (max-width:900px){
  .selectorModal{
    width:92vw;
    min-width:0;
    padding:26px 20px 28px;
  }

  .selectorGrid{
    gap:18px;
  }

  .productVideoButton{
    height:340px;
  }

  .selectorTitle h1{
    font-size:30px;
  }

  .lineLabel{
    font-size:20px;
  }
}

@media (max-width:700px){
  body{
    background:#d7dde2;
    color:#16324c;
    padding-bottom:78px;
  }

  .bgImage{
    background:
      linear-gradient(rgba(255,255,255,.22), rgba(255,255,255,.34)),
      url("bg-metal-mobile.png");
    background-size:cover;
    background-position:center;
    filter:none;
    transform:none;
  }

  .homeLogo{
    top:20px;
    left:20px;
  }

  .homeLogo img{
    height:26px;
  }

  .selectorShell{
    min-height:calc(100vh - 78px);
    padding:58px 16px 34px;
    align-items:flex-start;
  }

  .selectorModal{
    width:100%;
    min-width:0;
    padding:20px 16px 22px;
    border-radius:14px;
    background:rgba(255,255,255,.26);
    border:1px solid rgba(22,50,76,.18);
  }

  .selectorTitle{
    margin-bottom:18px;
  }

  .selectorTitle h1{
    color:#16324c;
    font-size:26px;
    letter-spacing:2px;
  }

  .selectorTitle p{
    color:#35506a;
    font-size:14px;
  }

  .selectorGrid{
    grid-template-columns:1fr;
    gap:16px;
  }

  .productVideoButton{
    height:260px;
    border-color:rgba(22,50,76,.24);
  }

  .productVideoButton::after{
    opacity:1;
    font-size:22px;
  }

  .lineLabel{
    font-size:19px;
    bottom:20px;
  }

  .lineSub{
    font-size:10px;
    left:16px;
    top:16px;
  }

  .closeLink{
    color:#16324c;
  }

  .footer{
    font-size:11px;
    padding:9px 10px;
  }

  .footerRow{
    gap:8px 12px;
  }
}
</style>
</head>

<body>

<div class="bgImage"></div>

<a href="/index.html" class="homeLogo">
  <img src="logo-home.png" alt="GRIMSON Home">

<main class="selectorShell">
  <section class="selectorModal" aria-label="Select GRIMSON product line">

    <div class="selectorTitle">
      <h1>SELECT YOUr pLATfOrM</h1>
      <p>Choose between the professional CORE line and the handcrafted PREMIUM line.</p>
    </div>

    <div class="selectorGrid">

      <a href="products-core.html" class="productVideoButton" aria-label="Explore GRIMSON MK-I CORE LINE">
        <span class="lineSub">CORE LINE</span>
        <video autoplay muted loop playsinline preload="auto">
          <source src="core-preview.mp4" type="video/mp4">

        <video autoplay muted loop playsinline preload="auto">
           <source src="premium-preview.mp4" type="video/mp4">
        </video>
        <span class="lineLabel">Mk-I prEMIUM</span>
      </a>

    </div>

    <a href="index.html" class="closeLink">Return to home</a>

  </section>
</main>

<footer class="footer">
  <div class="footerRow">
    <span>© 2026 GWR TEAM</span>
    <span class="sep">|</span>
    <span>GRIMSON™ is a trademark of GWR TEAM</span>
    <span class="sep">|</span>
    <span>18+ Restricted Sale</span>
    <span class="sep">|</span>
    <a href="terms.html">Terms</a>
    <span class="sep">|</span>
    <a href="privacy.html">Privacy</a>
  </div>
</footer>

</body>
</html>
